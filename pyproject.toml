[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "kaya-tools"
version = "0.1.0"
description = "Run code on UWA's Kaya HPC cluster from your own machine: sync, run, submit, watch, status."
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
kaya = "kaya_tools.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
